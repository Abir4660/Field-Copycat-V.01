<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    width: 280px;
    background: #ffffff;
    color: #1a1a1a;
  }
  .header {
    padding: 16px;
    border-bottom: 1px solid #f0f0f0;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo {
    width: 32px; height: 32px;
    background: #1D9E75;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 16px; flex-shrink: 0;
  }
  .logo-text { font-size: 15px; font-weight: 600; }
  .logo-sub { font-size: 11px; color: #888; margin-top: 1px; }

  .status-bar {
    padding: 10px 16px;
    background: #f8f8f8;
    border-bottom: 1px solid #f0f0f0;
    font-size: 12px;
    color: #555;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #ccc;
    flex-shrink: 0;
  }
  .status-dot.active { background: #1D9E75; }
  .status-dot.pasting { background: #378ADD; }
  .status-dot.error { background: #E24B4A; }

  .section { padding: 14px 16px; border-bottom: 1px solid #f0f0f0; }
  .section-title {
    font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.05em;
    color: #999; margin-bottom: 10px;
  }

  .btn {
    width: 100%;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid #e0e0e0;
    background: #fff;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    color: #1a1a1a;
    transition: background 0.15s;
    margin-bottom: 8px;
  }
  .btn:last-child { margin-bottom: 0; }
  .btn:hover { background: #f5f5f5; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn.primary {
    background: #1D9E75; color: white;
    border-color: #1D9E75;
  }
  .btn.primary:hover { background: #0F6E56; }
  .btn.blue {
    background: #378ADD; color: white;
    border-color: #378ADD;
  }
  .btn.blue:hover { background: #185FA5; }
  .btn .icon { font-size: 16px; flex-shrink: 0; }
  .btn .label { flex: 1; text-align: left; }
  .btn .badge {
    font-size: 11px; font-weight: 600;
    background: rgba(255,255,255,0.25);
    padding: 2px 6px; border-radius: 99px;
  }
  .btn.primary .badge, .btn.blue .badge {
    background: rgba(255,255,255,0.3);
    color: white;
  }

  .fields-preview {
    background: #f8f8f8;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12px;
    color: #444;
    max-height: 130px;
    overflow-y: auto;
  }
  .field-item {
    display: flex; align-items: baseline; gap: 6px;
    padding: 4px 0;
    border-bottom: 1px solid #eee;
  }
  .field-item:last-child { border-bottom: none; }
  .field-num {
    font-size: 10px; font-weight: 700;
    color: #1D9E75;
    min-width: 16px;
  }
  .field-val {
    flex: 1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    color: #222;
  }
  .field-type { font-size: 10px; color: #999; }
  .empty-hint { color: #aaa; font-style: italic; text-align: center; padding: 8px 0; }

  .footer {
    padding: 10px 16px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .clear-btn {
    font-size: 12px; color: #E24B4A;
    background: none; border: none; cursor: pointer;
    font-family: inherit; padding: 0;
  }
  .clear-btn:hover { text-decoration: underline; }
  .count-label { font-size: 12px; color: #888; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">&#9707;</div>
  <div>
    <div class="logo-text">Field Copycat</div>
    <div class="logo-sub">Copy fields between web forms</div>
  </div>
</div>

<div class="status-bar">
  <div class="status-dot" id="statusDot"></div>
  <span id="statusText">Ready — choose an action below</span>
</div>

<div class="section">
  <div class="section-title">Step 1 — Capture</div>
  <button class="btn primary" id="btnCapture">
    <span class="icon">&#9702;</span>
    <span class="label">Select area to copy fields</span>
  </button>
</div>

<div class="section">
  <div class="section-title">Captured fields <span id="capturedCount"></span></div>
  <div class="fields-preview" id="fieldsPreview">
    <div class="empty-hint">No fields captured yet</div>
  </div>
</div>

<div class="section">
  <div class="section-title">Step 2 — Paste</div>
  <button class="btn blue" id="btnPaste" disabled>
    <span class="icon">&#9889;</span>
    <span class="label">Select area to paste into</span>
    <span class="badge" id="pasteCount"></span>
  </button>
</div>

<div class="footer">
  <button class="clear-btn" id="btnClear">Clear all</button>
  <span class="count-label" id="footerStatus"></span>
</div>

<script src="popup.js"></script>
</body>
</html>
